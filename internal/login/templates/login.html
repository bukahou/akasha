<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akasha — 统一登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at top, #1b1030 0%, #0a0a0f 60%);
      font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
      color: #e5e5e5;
    }
    .card {
      width: min(92vw, 380px); padding: 40px 32px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(167,139,250,0.25);
      border-radius: 18px; backdrop-filter: blur(12px);
      box-shadow: 0 0 40px rgba(124,58,237,0.15);
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand h1 { font-size: 26px; letter-spacing: 4px; color: #c4b5fd; font-weight: 700; }
    .brand p  { font-size: 12px; color: #8b8b96; margin-top: 6px; }
    label { display: block; font-size: 13px; color: #a1a1aa; margin: 14px 0 6px; }
    input {
      width: 100%; height: 42px; padding: 0 14px; font-size: 15px;
      background: rgba(255,255,255,0.06); color: #fff;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; outline: none;
    }
    input:focus { border-color: #a78bfa; }
    button {
      width: 100%; height: 44px; margin-top: 22px; font-size: 15px; font-weight: 600;
      color: #fff; background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none; border-radius: 10px; cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    .error {
      margin-top: 16px; padding: 10px 14px; font-size: 13px;
      color: #fca5a5; background: rgba(220,38,38,0.12);
      border: 1px solid rgba(220,38,38,0.35); border-radius: 10px;
    }
    .federated {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 44px; margin-bottom: 10px; font-size: 15px; font-weight: 600;
      color: #e9e6f5; text-decoration: none;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16);
      border-radius: 10px;
    }
    .federated:hover { background: rgba(255,255,255,0.1); }
    .hint {
      margin-top: 20px; font-size: 12px; line-height: 1.7;
      color: #8b87a3; text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>AKASHA</h1>
      <p>bukahou 统一身份</p>
    </div>
    {{if .ErrorMsg}}<div class="error">{{.ErrorMsg}}</div>{{end}}

    {{range .Providers}}
      <a class="federated" href="/federation/{{.}}/start?next={{$.Next | urlquery}}">{{$.Label .}}</a>
    {{end}}

    <p class="hint">akasha 不保存密码，登录完全由上述第三方完成。</p>
  </div>
</body>
</html>
